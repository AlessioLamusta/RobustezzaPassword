<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>31. RobustazzaPassword</title>
    <style>
        div#progress_bar {
            border: 1px solid #cccccc;
            height: 18px;
            margin-top: 10px;
        }

        div#bar {
            background-color: #ffffff;
            height: 18px;
        }

        div#testo {
            display: inline;
        }
    </style>
    <script type="application/javascript">

        const arrayRegularExpression = [
            /.{8,}/, //Minimo 8 caratteri
            /[a-z]/, // almeno 1 minuscola
            /[A-Z]/, // Almeno una maiuscola
            /[0-9]/, // Almeno un numero
            /[^A-Za-z0-9]/ // Almeno 1 simbolo
        ];
        const num_controlli = arrayRegularExpression.length;
        const testoRobustezza = [
            "",
            "Molto bassa",
            "Bassa",
            "Media",
            "Forte",
            "Molto Forte"
        ];
        const arrEmoji = [
            "",
            "😫",
            "😟",
            "🤔",
            "✅",
            "🔒"
        ]

        window.onload = function () {
            const input = document.getElementById("password");

            let widthInput = input.getBoundingClientRect().width;
            let heightInput = input.getBoundingClientRect().height;
            const divProgress = document.getElementById("progress_bar");
            divProgress.style.width = "200px";
            input.addEventListener("keyup", function () { verifica(input) });
        }

        function verifica(input) {
            const percentuale = robustezzaPassword(input.value);
            const incremento = 100 / num_controlli;
            const divBar = document.getElementById("bar");
            const testo = document.getElementById("testo");
            const emoji = document.getElementById("emoji");
            testo.textContent = testoRobustezza[Math.round(percentuale / 100 * 5)];
            emoji.textContent = arrEmoji[Math.round(percentuale / 100 * 5)];
            bar.style.width = (200 / 100 * percentuale) + "px";
            bar.style.backgroundColor = "hsl(" + percentuale + ", 100%, 34%)";
        }

        function robustezzaPassword(password) {
            let x = 0; // contatore che mi dice quanto è robusta la password
            incremento = 100 / num_controlli;
            password = password.trim() // tolgo spazi iniziali e finali
            let check = /^\S+$/; //RegExpression che controlla che non ci siano spazi all'interno
            if (!check.test(password)) {
                x = 0; //password non valida
            } else {
                for (let i = 0; i < num_controlli; i++) {
                    check = arrayRegularExpression[i];
                    if (check.test(password)) {
                        x += incremento;
                    }
                }
            }
            return x;
        }

    </script>
</head>

<body>
    <form>
        <fieldset>
            <legend>Verifica robustezza password</legend>
            <label for="password">Inserisci Password</label><br>
            <input type="password" id="password">
            <div id="progress_bar">
                <div id="bar"></div>
            </div>
            Livello robustezza: <span id="emoji"></span> <div id="testo"></div> 
        </fieldset>
    </form>
    <br>
    La password :
    <ul>
        <li>Deve contenere almeno una minuscola</li>
        <li>Deve contenere una maiuscola</li>
        <li>Deve contenere un numero e un simbolo</li>
        <li>Deve essere almeno di 8 caratteri</li>
        <li>Non può contenere spazi</li>
    </ul>
</body>

</html>
